name: Build CV and push to S3

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-cv.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Same script as local; writes the PDFs to ./build
      - name: Build PDF files
        run: bun run build master.md

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload PDFs to S3
        run: >
          aws s3
          cp ./build s3://cv-giuseppe-lanna
          --recursive
          --exclude "*"
          --include "*.pdf"
